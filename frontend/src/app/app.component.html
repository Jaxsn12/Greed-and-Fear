<div class="viz-root">
  <div class="app-bar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 16L9 10L13 14L21 6" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 6H21V12" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="brand-text-name">Greed &amp; Fear</div>
        <div class="brand-text-tagline">insights. Trade. Thrive.</div>
      </div>
    </div>
    <div class="app-bar-actions">
      <button id="refresh" [disabled]="refreshing" (click)="onRefreshClick()">
        <ng-container *ngIf="!refreshing; else runningTpl">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>
          Run now
        </ng-container>
        <ng-template #runningTpl>Running&hellip;</ng-template>
      </button>
      <button id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode" (click)="toggleTheme()" [innerHTML]="themeIcon"></button>
    </div>
  </div>

  <div class="content">
    <div class="title-row">
      <div>
        <h1>
          Pre-Market Sentiment Indicator
          <svg class="info-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01" stroke-linecap="round"/></svg>
        </h1>
        <div class="subtitle">
          <b>Direction:</b> NASDAQ <span class="sep">&middot;</span> Dow Jones <span class="sep">&middot;</span> NSE Advances/Declines <span class="sep">&middot;</span> GIFT Nifty
          <span class="sep">|</span>
          <b>Volatility:</b> India VIX
        </div>
      </div>
      <div class="last-run-pill" id="last-run-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>
        <span id="last-run-text" [innerHTML]="lastRunText"></span>
      </div>
    </div>

    <app-hero [run]="run"></app-hero>

    <app-tiles [run]="run"></app-tiles>

    <app-history-table [history]="history"></app-history-table>
  </div>
</div>
